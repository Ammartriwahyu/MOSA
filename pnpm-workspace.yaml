packages:
  - frontend
  - backend

# sharp dan unrs-resolver: skrip build tidak diperlukan (hasil create-next-app).
# esbuild: dipakai tsx (server lokal backend); skripnya memasang binari platform.
# @google/genai (preinstall hanya echo) dan protobufjs (cek versi): tidak diperlukan.
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@next/env@16.4.6'
  - '@next/eslint-plugin-next@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - eslint-config-next@16.4.6
  - next@16.4.6
  - '@typescript-eslint/eslint-plugin@8.72.2'
  - '@typescript-eslint/parser@8.72.2'
  - '@typescript-eslint/project-service@8.72.2'
  - '@typescript-eslint/scope-manager@8.72.2'
  - '@typescript-eslint/tsconfig-utils@8.72.2'
  - '@typescript-eslint/type-utils@8.72.2'
  - '@typescript-eslint/types@8.72.2'
  - '@typescript-eslint/typescript-estree@8.72.2'
  - '@typescript-eslint/utils@8.72.2'
  - '@typescript-eslint/visitor-keys@8.72.2'
  - typescript-eslint@8.72.2
  - lucide-react@1.71.0
